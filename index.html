<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Site mark (stylised R from the logo) with high-contrast PNG fallbacks -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raven Hospitality — refined stays, curated experiences and effortless booking." />
    <title>Raven Hospitality</title>

    <!-- Fonts are self-hosted (see src/Styles/fonts.css); preload the one
         used by almost every screen so text paints with the right metrics. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Hero image is the LCP element on the landing page -->
    <link rel="preload" as="image" href="/hero-room.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
